<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

#map{
  height:100vh;
  width:100%;
  position:relative;
  z-index:1;
}

/* ======================
   左下角公司 LOGO（響應式強效版）
====================== */

.brand-logo{
  position:absolute;
  bottom:24px;
  left:20px;
  z-index:9999;
  pointer-events:none;
  user-select:none;
}

/* 預設：手機版尺寸 */
.brand-logo img{
  height: 42px !important;
  width: auto !important;
  object-fit: contain;
  pointer-events: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.25));
}

/* 電腦版尺寸：針對螢幕寬度 768px 或以上強制放大 */
@media screen and (min-width: 768px) {
  .brand-logo img {
    height: 75px !important; /* PC 版直接加大至 75px */
  }
}

/* ======================
   右上角門市按鈕區（膠囊版）
====================== */

.store-buttons{
  position:absolute;
  top:20px;
  right:20px;
  z-index:9999;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.store-row{
  display:flex;
  align-items:center;
  gap:10px;
  justify-content:flex-end;
}

.store-buttons button{
  min-width:140px;
  padding:12px 26px;
  border-radius:40px;
  border:none;
  background:#ffffff;
  color:#6C2F86;
  font-size:15px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  transition:.25s ease;
  box-shadow:0 8px 22px rgba(108,47,134,.25);

  outline: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.store-buttons button:focus{
  outline: none;
}

.store-buttons button:hover{
  background:#6C2F86;
  color:#ffffff;
  box-shadow:0 10px 26px rgba(108,47,134,.35);
  transform:translateY(-2px);
}

.store-buttons button.active{
  background:#6C2F86;
  color:#ffffff;
  box-shadow:0 10px 26px rgba(108,47,134,.35);
}

/* ======================
   圓形白底 WhatsApp 按鈕
====================== */

.wa-btn{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 22px rgba(108,47,134,.25);
  cursor:pointer;
  transition:.25s ease;
  text-decoration:none;
  flex-shrink:0;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.wa-btn:hover{
  transform:scale(1.1);
  box-shadow:0 10px 26px rgba(108,47,134,.35);
  background:#25D366;
}

.wa-btn img{
  width:30px;
  height:30px;
  object-fit:contain;
}

/* ======================
   Popup 設計
====================== */

.leaflet-popup-content-wrapper{
  border-radius:14px;
  box-shadow:0 12px 28px rgba(0,0,0,.18);
  padding-top:6px;
}

.info-card{max-width:300px;}
.info-title{font-size:16px;font-weight:600;margin-bottom:8px;padding-right:20px;}
.info-text{font-size:14px;margin-bottom:4px;color:#222;}
.mtr-note{font-size:13px;color:#666;margin-bottom:6px;}

/* 美化及加大關閉按鈕 (×) */
.leaflet-container a.leaflet-popup-close-button {
  width: 32px !important;
  height: 32px !important;
  font-size: 22px !important;
  line-height: 30px !important;
  color: #6C2F86 !important;
  top: 10px !important;
  right: 10px !important;
  border-radius: 50% !important;
  transition: .25s ease !important;
  outline: none !important;
}

.leaflet-container a.leaflet-popup-close-button:hover {
  background: #6C2F86 !important;
  color: #ffffff !important;
}

/* ======================
   導航按鈕（陰影版）
====================== */

.nav-row{
  display:flex;
  justify-content:center;
  gap:24px;
  margin-top:16px;
}

.nav-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.nav-circle{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s;
  box-shadow:0 6px 18px rgba(108,47,134,.18);
}

.nav-circle img{
  width:30px;
  height:30px;
  object-fit:contain;
  filter: brightness(0) saturate(100%) invert(17%) sepia(78%) saturate(1436%) hue-rotate(262deg) brightness(92%) contrast(92%);
}

.nav-item:hover .nav-circle,
.nav-item.active .nav-circle{
  background:#6C2F86;
  box-shadow:0 8px 22px rgba(108,47,134,.35);
}

.nav-item:hover img,
.nav-item.active img{
  filter: brightness(0) invert(1);
}

.nav-label{
  font-size:11px;
  color:#444;
  margin-top:6px;
}

/* ======================
   紫色定位圖示
====================== */

.google-pin{
  position:relative;
  width:29px;
  height:29px;
  background:#6C2F86;
  border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);
  border:2.5px solid white;
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}

.pin-inner{
  position:absolute;
  width:12px;
  height:12px;
  background:white;
  border-radius:50%;
  top:8px;
  left:8px;
}
</style>
